name: Auto-prepend Stable Branch to PR Title

on:
  pull_request:
    types: [opened, edited]
    branches:
      - 'stable*'

concurrency:
  group: stable-pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Wait for potential title edits
        run: sleep 15
      
      - name: Get PR details and update title
        uses: actions/github-script@8080ea76f33cbec420e9194e15f440724372f884 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const baseBranch = pr.base.ref;
            const currentTitle = pr.title;
            
            // Check if this is a stable branch
            // Should not happen as we only trigger on stable* branches 🤷‍♀️
            if (!baseBranch.startsWith('stable')) {
              console.log(`Not a stable branch: ${baseBranch}`);
              return;
            }

            // Check if title already has the prefix
            if (currentTitle.startsWith('[stable')) {
              console.log(`Title already has stable prefix: ${currentTitle}`);
              return;
            }
                        
            const newTitle = `[${baseBranch}] ${currentTitle}`;
            console.log(`Updating title from: "${currentTitle}" to: "${newTitle}"`);
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              title: newTitle,
            });
